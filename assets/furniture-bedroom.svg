<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" preserveAspectRatio="xMidYMax meet">
  <defs>
    <filter id="bedShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>
    <!-- Minimalist Upholstered Grey Linen Palette -->
    <linearGradient id="greyLinen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#646670" />
      <stop offset="50%" stop-color="#51535a" />
      <stop offset="100%" stop-color="#3d3e44" />
    </linearGradient>
    <linearGradient id="oakWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4e3b2b" />
      <stop offset="50%" stop-color="#3a2b1f" />
      <stop offset="100%" stop-color="#241a13" />
    </linearGradient>
    <linearGradient id="linenDuvet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0efe9" />
      <stop offset="40%" stop-color="#dfded7" />
      <stop offset="100%" stop-color="#c5c4bc" />
    </linearGradient>
    <linearGradient id="pillowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e8e7e1" />
      <stop offset="100%" stop-color="#d0cec5" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255, 220, 160, 0.45)" />
      <stop offset="60%" stop-color="rgba(255, 200, 120, 0.12)" />
      <stop offset="100%" stop-color="rgba(255, 200, 120, 0)" />
    </radialGradient>
  </defs>

  <!-- Ambient Floor Shadow -->
  <ellipse cx="600" cy="305" rx="520" ry="14" fill="#000" opacity="0.6" filter="blur(7px)" />

  <!-- Left Floating Nightstand -->
  <g id="nightstandLeft" transform="translate(130, 200)">
    <!-- Ambient Lamp Glow -->
    <circle cx="50" cy="-25" r="70" fill="url(#lampGlow)" />
    <!-- Floating Drawer Box -->
    <rect x="0" y="20" width="105" height="55" rx="3" fill="url(#oakWood)" stroke="#5d4734" stroke-width="1.2" />
    <line x1="0" y1="48" x2="105" y2="48" stroke="#1c140e" stroke-width="1.5" />
    <!-- Minimalist Mushroom Lamp -->
    <line x1="50" y1="20" x2="50" y2="-10" stroke="#c89253" stroke-width="3" stroke-linecap="round" />
    <path d="M 30 -10 C 30 -30, 70 -30, 70 -10 Z" fill="#fdfbfa" stroke="#e0ded8" stroke-width="1" />
    <circle cx="50" cy="20" r="14" fill="#241a13" stroke="#c89253" stroke-width="1" />
  </g>

  <!-- Right Floating Nightstand -->
  <g id="nightstandRight" transform="translate(965, 200)">
    <!-- Ambient Lamp Glow -->
    <circle cx="55" cy="-25" r="70" fill="url(#lampGlow)" />
    <!-- Floating Drawer Box -->
    <rect x="0" y="20" width="105" height="55" rx="3" fill="url(#oakWood)" stroke="#5d4734" stroke-width="1.2" />
    <line x1="0" y1="48" x2="105" y2="48" stroke="#1c140e" stroke-width="1.5" />
    <!-- Minimalist Mushroom Lamp -->
    <line x1="55" y1="20" x2="55" y2="-10" stroke="#c89253" stroke-width="3" stroke-linecap="round" />
    <path d="M 35 -10 C 35 -30, 75 -30, 75 -10 Z" fill="#fdfbfa" stroke="#e0ded8" stroke-width="1" />
    <circle cx="55" cy="20" r="14" fill="#241a13" stroke="#c89253" stroke-width="1" />
  </g>

  <!-- Clean Straight-on Platform Bed with Minimalist Upholstered Grey Linen Headboard -->
  <g id="platformBed" filter="url(#bedShadow)">
    <!-- Low-Profile Upholstered Grey Linen Headboard (Top at y=115, height 120px) -->
    <rect x="250" y="115" width="700" height="120" rx="8" fill="url(#greyLinen)" stroke="#45464c" stroke-width="1.5" />

    <!-- Upholstered Horizontal Channel Seams -->
    <line x1="252" y1="155" x2="948" y2="155" stroke="#33343a" stroke-width="2" />
    <line x1="252" y1="195" x2="948" y2="195" stroke="#33343a" stroke-width="2" />
    <line x1="600" y1="116" x2="600" y2="234" stroke="#33343a" stroke-width="2" />

    <!-- 2 Main Crisp White Pillows (Side by Side) -->
    <!-- Left Pillows -->
    <rect x="290" y="150" width="280" height="70" rx="14" fill="url(#pillowGrad)" stroke="#c2c0b6" stroke-width="1.2" />
    <rect x="315" y="165" width="230" height="55" rx="12" fill="url(#pillowGrad)" stroke="#b5b3a9" stroke-width="1.2" />

    <!-- Right Pillows -->
    <rect x="630" y="150" width="280" height="70" rx="14" fill="url(#pillowGrad)" stroke="#c2c0b6" stroke-width="1.2" />
    <rect x="655" y="165" width="230" height="55" rx="12" fill="url(#pillowGrad)" stroke="#b5b3a9" stroke-width="1.2" />

    <!-- Clean Folded Duvet Edge (Top at y=205, extending to bottom) -->
    <path d="M 235 205 Q 600 215, 965 205 L 975 315 L 225 315 Z" fill="url(#linenDuvet)" stroke="#bebdb5" stroke-width="1.5" />

    <!-- Folded Linen Runner Accent (Charcoal/Oatmeal) -->
    <path d="M 225 255 Q 600 265, 975 255 L 980 315 L 220 315 Z" fill="#2d2b29" stroke="#1b1a19" stroke-width="1.2" />
  </g>
</svg>
