<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" preserveAspectRatio="xMidYMax meet">
  <defs>
    <filter id="sofaShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.55" />
    </filter>
    <filter id="plantShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.45" />
    </filter>
    <!-- Warm Modern Beige / Oatmeal Sofa Palette -->
    <linearGradient id="sofaBeigeBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ded9d0" />
      <stop offset="100%" stop-color="#c5beb3" />
    </linearGradient>
    <linearGradient id="sofaBeigeCushion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eae6df" />
      <stop offset="60%" stop-color="#d8d2c6" />
      <stop offset="100%" stop-color="#c4bcb0" />
    </linearGradient>
    <linearGradient id="pillowTerracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c86d51" />
      <stop offset="100%" stop-color="#964b33" />
    </linearGradient>
    <linearGradient id="pillowOlive" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#737966" />
      <stop offset="100%" stop-color="#4d5342" />
    </linearGradient>
    <linearGradient id="potWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0eee9" />
      <stop offset="50%" stop-color="#dfdbd3" />
      <stop offset="100%" stop-color="#c8c3b9" />
    </linearGradient>
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5d48" />
      <stop offset="100%" stop-color="#2d3d2c" />
    </linearGradient>
  </defs>

  <!-- Ambient Floor Shadow -->
  <ellipse cx="600" cy="302" rx="540" ry="16" fill="#000000" opacity="0.55" filter="blur(8px)" />

  <!-- LEFT FLANKING ARCHITECTURAL TALL POTTED PLANT (Fiddle-Leaf Fig) -->
  <g id="plantLeft" filter="url(#plantShadow)">
    <!-- Pot Shadow -->
    <ellipse cx="90" cy="304" rx="42" ry="8" fill="#000" opacity="0.5" />
    <!-- Ceramic Cylindrical Pot -->
    <rect x="58" y="225" width="64" height="76" rx="4" fill="url(#potWhite)" stroke="#b5af9f" stroke-width="1.2" />
    <ellipse cx="90" cy="225" rx="32" ry="7" fill="#8c8578" />
    <!-- Soil / Moss Base -->
    <ellipse cx="90" cy="225" rx="30" ry="6" fill="#2d2822" />
    <!-- Central Stems -->
    <path d="M 90 225 Q 86 160, 94 110 Q 98 80, 88 45" fill="none" stroke="#3d493a" stroke-width="5" stroke-linecap="round" />
    <path d="M 88 170 Q 72 135, 62 105" fill="none" stroke="#3d493a" stroke-width="4" stroke-linecap="round" />
    <path d="M 92 145 Q 110 120, 118 85" fill="none" stroke="#3d493a" stroke-width="3.5" stroke-linecap="round" />
    <!-- Broad Fiddle Leaves -->
    <!-- Top Leaf -->
    <path d="M 88 45 C 70 30, 75 10, 92 12 C 108 14, 106 35, 88 45 Z" fill="#4d614b" stroke="#2c3a2a" stroke-width="1" />
    <path d="M 88 45 Q 92 25, 92 12" fill="none" stroke="#688065" stroke-width="1.5" />
    <!-- Leaf Left High -->
    <path d="M 62 105 C 38 90, 42 65, 62 72 C 78 78, 76 98, 62 105 Z" fill="url(#leafGreen)" stroke="#2c3a2a" stroke-width="1" />
    <!-- Leaf Right High -->
    <path d="M 118 85 C 138 70, 142 90, 126 102 C 114 110, 108 95, 118 85 Z" fill="url(#leafGreen)" stroke="#2c3a2a" stroke-width="1" />
    <!-- Leaf Mid Left -->
    <path d="M 80 145 C 50 135, 48 160, 70 168 C 85 174, 90 155, 80 145 Z" fill="url(#leafGreen)" stroke="#2c3a2a" stroke-width="1" />
    <!-- Leaf Mid Right -->
    <path d="M 95 130 C 122 120, 130 145, 110 154 C 95 160, 90 140, 95 130 Z" fill="#3b4c39" stroke="#2c3a2a" stroke-width="1" />
    <!-- Leaf Low Left -->
    <path d="M 82 190 C 58 185, 54 210, 75 212 C 88 213, 90 200, 82 190 Z" fill="#3b4c39" stroke="#2c3a2a" stroke-width="1" />
  </g>

  <!-- RIGHT FLANKING ARCHITECTURAL TALL POTTED PLANT (Snake Plant / Sansevieria) -->
  <g id="plantRight" filter="url(#plantShadow)">
    <!-- Pot Shadow -->
    <ellipse cx="1110" cy="304" rx="40" ry="8" fill="#000" opacity="0.5" />
    <!-- Terracotta / Charcoal Pot -->
    <rect x="1080" y="230" width="60" height="72" rx="3" fill="#2c2b30" stroke="#484750" stroke-width="1.2" />
    <ellipse cx="1110" cy="230" rx="30" ry="6.5" fill="#1b1a1e" />
    <!-- Architectural Upright Snake Leaves with Gold/Cream Edges -->
    <path d="M 1110 230 Q 1112 120, 1110 50 Q 1108 120, 1110 230 Z" fill="#3b4d3a" stroke="#c4b87e" stroke-width="1.8" />
    <path d="M 1100 230 Q 1092 140, 1088 75 Q 1098 140, 1100 230 Z" fill="#2f3f2e" stroke="#b0a56a" stroke-width="1.5" />
    <path d="M 1120 230 Q 1128 140, 1132 70 Q 1122 140, 1120 230 Z" fill="#2f3f2e" stroke="#b0a56a" stroke-width="1.5" />
    <path d="M 1092 230 Q 1080 160, 1072 105 Q 1088 165, 1092 230 Z" fill="#384937" stroke="#9e935a" stroke-width="1.2" />
    <path d="M 1128 230 Q 1140 160, 1146 110 Q 1132 165, 1128 230 Z" fill="#384937" stroke="#9e935a" stroke-width="1.2" />
  </g>

  <!-- MODERN LOW-PROFILE BEIGE SOFA (Centered, Orthogonal, max height at y=95) -->
  <g id="modernBeigeSofa" filter="url(#sofaShadow)">
    <!-- Sleek Matte Black Metal Legs with Brass Foot Caps -->
    <line x1="240" y1="260" x2="225" y2="305" stroke="#0a0a0c" stroke-width="6" stroke-linecap="round" />
    <line x1="380" y1="260" x2="380" y2="305" stroke="#0a0a0c" stroke-width="5" stroke-linecap="round" />
    <line x1="820" y1="260" x2="820" y2="305" stroke="#0a0a0c" stroke-width="5" stroke-linecap="round" />
    <line x1="960" y1="260" x2="975" y2="305" stroke="#0a0a0c" stroke-width="6" stroke-linecap="round" />
    <!-- Brass Leg Caps -->
    <line x1="227" y1="298" x2="225" y2="305" stroke="#c89253" stroke-width="6" stroke-linecap="round" />
    <line x1="973" y1="298" x2="975" y2="305" stroke="#c89253" stroke-width="6" stroke-linecap="round" />

    <!-- Sofa Base Frame (Low-Profile Natural Timber Underframe) -->
    <rect x="200" y="240" width="800" height="26" rx="3" fill="url(#sofaBeigeBody)" stroke="#aba396" stroke-width="1" />

    <!-- Sofa Backrest (Orthogonal, flat top at y=95) -->
    <rect x="200" y="95" width="800" height="150" rx="8" fill="url(#sofaBeigeBody)" stroke="#aba396" stroke-width="1" />

    <!-- Sofa Backrest Cushion Seams -->
    <line x1="466" y1="96" x2="466" y2="240" stroke="#b0a89a" stroke-width="2" />
    <line x1="733" y1="96" x2="733" y2="240" stroke="#b0a89a" stroke-width="2" />

    <!-- 3 Plush Back Cushions (Soft Oatmeal/Beige Weave) -->
    <rect x="210" y="105" width="248" height="130" rx="6" fill="url(#sofaBeigeCushion)" stroke="#c2bbb0" stroke-width="1" />
    <rect x="476" y="105" width="248" height="130" rx="6" fill="url(#sofaBeigeCushion)" stroke="#c2bbb0" stroke-width="1" />
    <rect x="742" y="105" width="248" height="130" rx="6" fill="url(#sofaBeigeCushion)" stroke="#c2bbb0" stroke-width="1" />

    <!-- Throw Pillow Left (Terracotta Accent) -->
    <rect x="235" y="155" width="85" height="85" rx="8" transform="rotate(-6 277 197)" fill="url(#pillowTerracotta)" stroke="#7c3722" stroke-width="1" />

    <!-- Throw Pillow Right (Muted Studio Olive) -->
    <rect x="880" y="155" width="85" height="85" rx="8" transform="rotate(7 922 197)" fill="url(#pillowOlive)" stroke="#3f4534" stroke-width="1" />

    <!-- 3 Base Seat Cushions -->
    <rect x="205" y="215" width="258" height="42" rx="5" fill="url(#sofaBeigeCushion)" stroke="#b8b1a4" stroke-width="1.2" />
    <rect x="471" y="215" width="258" height="42" rx="5" fill="url(#sofaBeigeCushion)" stroke="#b8b1a4" stroke-width="1.2" />
    <rect x="737" y="215" width="258" height="42" rx="5" fill="url(#sofaBeigeCushion)" stroke="#b8b1a4" stroke-width="1.2" />

    <!-- Left Armrest -->
    <rect x="180" y="155" width="45" height="102" rx="6" fill="url(#sofaBeigeBody)" stroke="#aba396" stroke-width="1.5" />
    <!-- Right Armrest -->
    <rect x="975" y="155" width="45" height="102" rx="6" fill="url(#sofaBeigeBody)" stroke="#aba396" stroke-width="1.5" />
  </g>
</svg>
