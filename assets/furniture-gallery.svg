<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" preserveAspectRatio="xMidYMax meet">
  <defs>
    <filter id="benchShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#000" flood-opacity="0.55" />
    </filter>
    <linearGradient id="leatherCushion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2c33" />
      <stop offset="60%" stop-color="#191a1d" />
      <stop offset="100%" stop-color="#101113" />
    </linearGradient>
    <linearGradient id="benchOak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4635" />
      <stop offset="100%" stop-color="#34251a" />
    </linearGradient>
  </defs>

  <!-- Ambient Floor Shadow -->
  <ellipse cx="600" cy="300" rx="360" ry="12" fill="#000" opacity="0.55" filter="blur(6px)" />

  <g id="galleryBench" filter="url(#benchShadow)">
    <!-- Sleek Matte Black Steel Legs -->
    <rect x="360" y="220" width="8" height="82" rx="2" fill="#0a0a0c" />
    <rect x="385" y="220" width="8" height="82" rx="2" fill="#0a0a0c" />
    <line x1="350" y1="302" x2="400" y2="302" stroke="#16171a" stroke-width="3" stroke-linecap="round" />

    <rect x="807" y="220" width="8" height="82" rx="2" fill="#0a0a0c" />
    <rect x="832" y="220" width="8" height="82" rx="2" fill="#0a0a0c" />
    <line x1="800" y1="302" x2="850" y2="302" stroke="#16171a" stroke-width="3" stroke-linecap="round" />

    <!-- Center Leg Support -->
    <rect x="596" y="220" width="8" height="82" rx="2" fill="#0a0a0c" />

    <!-- Solid Oak Plinth Base -->
    <rect x="330" y="210" width="540" height="14" rx="2" fill="url(#benchOak)" stroke="#6e5743" stroke-width="1.2" />

    <!-- Low-slung Tufted Black Leather Bench Cushion (Top at y=172, height 40px) -->
    <rect x="320" y="172" width="560" height="40" rx="5" fill="url(#leatherCushion)" stroke="#3f424b" stroke-width="1.5" />

    <!-- Tufting Buttons & Stitch Lines -->
    <circle cx="390" cy="192" r="3" fill="#0a0a0c" stroke="#4a4d57" stroke-width="0.8" />
    <circle cx="460" cy="192" r="3" fill="#0a0a0c" stroke="#4a4d57" stroke-width="0.8" />
    <circle cx="530" cy="192" r="3" fill="#0a0a0c" stroke="#4a4d57" stroke-width="0.8" />
    <circle cx="600" cy="192" r="3" fill="#0a0a0c" stroke="#4a4d57" stroke-width="0.8" />
    <circle cx="670" cy="192" r="3" fill="#0a0a0c" stroke="#4a4d57" stroke-width="0.8" />
    <circle cx="740" cy="192" r="3" fill="#0a0a0c" stroke="#4a4d57" stroke-width="0.8" />
    <circle cx="810" cy="192" r="3" fill="#0a0a0c" stroke="#4a4d57" stroke-width="0.8" />

    <line x1="322" y1="192" x2="878" y2="192" stroke="#121316" stroke-width="1" stroke-dasharray="8 6" opacity="0.6" />
  </g>
</svg>
